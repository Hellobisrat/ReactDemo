name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build -t bisrat1/reactdemo-backend:latest ./backend
          docker push bisrat1/reactdemo-backend:latest

      - name: Build frontend image
        run: |
          docker build -t bisrat1/reactdemo-frontend:latest ./frontend
          docker push bisrat1/reactdemo-frontend:latest

      - name: Deployment notice
        run: echo "Images pushed. Deploy manually using: helm upgrade reactdemo ./reactdemo-chart -n demo"
