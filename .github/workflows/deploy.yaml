name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t bisrat1/reactdemo-backend:latest ./backend
          docker push bisrat1/reactdemo-backend:latest

      - name: Build frontend image
        run: |
          docker build -t bisrat1/reactdemo-frontend:latest ./frontend
          docker push bisrat1/reactdemo-frontend:latest

      - name: Deploy using Terraform
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.MINIKUBE_HOST }}
          username: ${{ secrets.MINIKUBE_USER }}
          key: ${{ secrets.MINIKUBE_SSH_KEY }}
          script: |
            cd ~/reactdemo/infra
            terraform init
            terraform apply -auto-approve
