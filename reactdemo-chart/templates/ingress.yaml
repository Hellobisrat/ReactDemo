apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reactdemo-ingress
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - host: demo.local
      http:
        paths:
          - path: {{ .Values.ingress.apipath }}
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.port }}
          - path: {{ .Values.ingress.frontendpath }}
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}
